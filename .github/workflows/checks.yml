name: Checks

on:
  pull_request:
    # `edited` covers base-branch retargets, which change the commit set
    # without firing `synchronize`.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

jobs:
  checks:
    # Base changes alter the commit set that needs checking.
    permissions:
      contents: read
      pull-requests: read
    uses: portabletext/.github/.github/workflows/checks.yml@main
